<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; pointer-events: none">
<defs>
<radialGradient id="dr-bagliore" cx="40" cy="730" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1F6E6A" stop-opacity="0.55"></stop><stop offset="1" stop-color="#1F6E6A" stop-opacity="0"></stop></radialGradient>
<linearGradient id="dr-sfuma" x1="0" y1="430" x2="0" y2="650" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000000"></stop><stop offset="1" stop-color="#FFFFFF"></stop></linearGradient>
<mask id="dr-maschera" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844"><rect x="0" y="0" width="390" height="844" fill="url(#dr-sfuma)"></rect></mask>
</defs>
<rect x="0" y="0" width="390" height="844" fill="url(#dr-bagliore)"></rect>
<g mask="url(#dr-maschera)" fill="none" stroke-linecap="round">
<path d="{{bordo}}" stroke="#7FA8E0" stroke-width="0.8" opacity="{{opBordo}}"></path>
<path d="{{diagonali}}" stroke="#FFFFFF" stroke-width="0.8" opacity="{{opDiag}}"></path>
<path d="{{croce}}" stroke="#FF6B7D" stroke-width="0.9" opacity="{{opCroce}}"></path>
</g>
</svg>
<main style="position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 60px 20px 16px">
<h1 style="margin: 0; text-align: center; font-size: 19px; line-height: 28px; font-weight: 500">Dizionario</h1>
<div style="position: relative">
<label for="cerca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Cerca un vocabolo</label>
<span aria-hidden="true" style="position: absolute; left: 18px; top: 15px; display: flex; color: #93B4B0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>
<input id="cerca" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Cerca in italiano o in inglese" value="{{q}}" onChange="{{cerca}}" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 18px 0 50px; border-radius: 999px; border: 1.5px solid #3EE0CF; background: #0A1617; color: #FFFFFF; font-family: inherit; font-size: 16px; outline: none">
</div>
<section aria-label="Vocaboli" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px; border-radius: 22px; border: 1px solid #1B4A48; background: linear-gradient(180deg, #10423F 0%, #0B2628 40%, #0A1A1C 100%)">
<sc-for list="{{voci}}" as="v" hint-placeholder-count="0">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 13px 0; border-bottom: 1px solid #1E3E3D">
<span style="font-size: 16px; line-height: 24px; font-weight: 500; color: #FFFFFF">{{v.it}}</span>
<span lang="en" style="font-size: 14px; line-height: 21px; color: #93B4B0"><span style="color: #3EE0CF">{{v.main}}</span>{{v.altre}}</span>
</div>
</sc-for>
<sc-if value="{{vuoto}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 48px 8px; text-align: center">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; background: #0A1D1F; border: 1px solid #24504E; color: #3EE0CF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>
<p style="margin: 0; font-size: 17px; line-height: 25px; font-weight: 500; color: #FFFFFF">Nessun vocabolo contiene “{{q}}”</p>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #B7C9C7">Controlla come l’hai scritto.</p>
</div>
</sc-if>
</section>
</main>
<nav aria-label="Sezioni" style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #070A0B; border-top: 1px solid #172022; padding: 8px 4px 24px">

<span>Esercizi</span>
</a>

<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 30px"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="13" rx="2"></rect><path d="M8 4h11a2 2 0 0 1 2 2v11"></path></svg></span>
<span>Vocaboli</span>

<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 30px; border-radius: 999px; background: #0F3B3A"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"></path><path d="M5 17a3 3 0 0 1 3-3h10"></path></svg></span>
<span>Dizionario</span>

<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 30px"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14"></path><path d="M5 12h14"></path><path d="M5 18h9"></path></svg></span>
<span>Grammatica</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const VOCI = [
{ it: 'affollato', en: ['crowded', 'packed'] },
{ it: 'amico', en: ['friend'] },
{ it: 'biblioteca', en: ['library'] },
{ it: 'comprare', en: ['buy'] },
{ it: 'leggere', en: ['read'] },
{ it: 'libro', en: ['book'] },
{ it: 'perché', en: ['why', 'because'] },
{ it: 'pesca (frutto)', en: ['peach'] },
{ it: 'pesca (sport)', en: ['fishing'] },
{ it: 'stanco', en: ['tired'] },
{ it: 'svegliarsi', en: ['wake up'] },
{ it: 'viaggio', en: ['trip', 'journey'] }
];
function norm(s) {
return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[’‘ʼ]/g, "'").replace(/\s+/g, ' ').trim();
}
function generaBandiera() {
const P = (u, v) => {
const s = u / 60, t = v / 30;
const x = -30 + s * 450 + 25 * (t - 0.5) * (1 - s);
const top = 470 + s * 220, bot = 900 - s * 110;
const y = top + t * (bot - top) + 35 * Math.sin(3 * s + 0.3) * (1 - 0.5 * s);
return x.toFixed(1) + ' ' + y.toFixed(1);
};
const L = (u0, v0, u1, v1) => {
const p = [];
for (let i = 0; i <= 32; i++) p.push(P(u0 + (u1 - u0) * i / 32, v0 + (v1 - v0) * i / 32));
return 'M' + p.join(' L');
};
const croce = [], diagonali = [];
for (let k = -3; k <= 3; k++) {
croce.push(L(0, 15 + k, 60, 15 + k));
croce.push(L(30 + k, 0, 30 + k, 30));
}
for (const d of [-2.5, -1.25, 0, 1.25, 2.5]) {
const c = d * Math.sqrt(5);
let v0 = Math.max(0, -c / 2), v1 = Math.min(30, (60 - c) / 2);
diagonali.push(L(2 * v0 + c, v0, 2 * v1 + c, v1));
v0 = Math.max(0, c / 2); v1 = Math.min(30, (60 + c) / 2);
diagonali.push(L(60 + c - 2 * v0, v0, 60 + c - 2 * v1, v1));
}
const bordo = [L(0, 0, 60, 0), L(0, 30, 60, 30), L(0, 0, 0, 30), L(60, 0, 60, 30)];
return { croce: croce.join(' '), diagonali: diagonali.join(' '), bordo: bordo.join(' '), opCroce: 0.52, opDiag: 0.4, opBordo: 0.24 };
}
const BANDIERA = generaBandiera();
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const q = s.q ?? 'biscotto';
const nq = norm(q);
const voci = VOCI
.filter((v) => !nq || norm(v.it).includes(nq) || v.en.some((t) => norm(t).includes(nq)))
.map((v) => ({ it: v.it, main: v.en[0], altre: v.en.length > 1 ? ', ' + v.en.slice(1).join(', ') : '' }));
return {
...BANDIERA,
q,
cerca: (e) => this.setState({ q: e.target.value }),
voci,
vuoto: voci.length === 0
};
}
}
</script>
</body>
