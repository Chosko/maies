name: Domanda a sorpresa

on:
  schedule:
    - cron: '17 9 * * *'
    - cron: '47 13 * * *'
    # La domanda delle 21:30 italiane: 19:30 UTC con l'ora legale, 20:30 UTC
    # con quella solare. Parte a entrambe e SOLO_ALLE fa inviare solo quella giusta.
    - cron: '30 19 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run domanda-a-sorpresa
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SOLO_ALLE: ${{ startsWith(github.event.schedule, '30 ') && '21' || '' }}
