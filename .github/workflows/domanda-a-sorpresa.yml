name: Domanda a sorpresa

on:
  schedule:
    - cron: '17 9 * * *'
    - cron: '47 13 * * *'
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run domanda-a-sorpresa
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
